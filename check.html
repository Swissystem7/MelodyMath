<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MelodyMath · בדיקה לפני ואחרי יחידה</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="description" content="בדיקה קצרה לפני יחידה ואחריה, נשמרת רק במכשיר. לא מחקר מבוקר.">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{--ink:#1f1e1d;--muted:#6b6a65;--purple:#d97757;--accent:#d97757;--bg:#faf9f5;--card:#ffffff;--line:#e8e6dc;--font:"Assistant","Heebo","Rubik","Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme: dark){:root{--ink:#faf9f5;--muted:#a8a69f;--purple:#e08264;--accent:#e08264;--bg:#1f1e1d;--card:#2b2a27;--line:#3e3d39}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
  .wrap{max-width:720px;margin:auto;padding:20px 14px 60px}
  h1{font-size:clamp(1.5rem,6vw,2.2rem);margin:6px 0}
  h2{font-size:1.2rem;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin:16px 0}
  .note{color:var(--muted);font-size:.92rem}
  label{display:block;margin:8px 0 4px;font-weight:700}
  input,select{width:100%;min-height:44px;min-height:48px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  button{min-height:44px;min-height:48px;min-width:48px;font:inherit;font-weight:700;padding:8px 14px;border-radius:12px;border:2px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--purple)}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .row button{flex:1 1 9rem}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:8px;margin-top:14px}
  .choices button{font-size:1.25rem;background:#fff;color:var(--ink);border-color:var(--line);transition:background-color .15s ease,border-color .15s ease}
  .choices button:hover{background:#ede6ff;border-color:var(--purple)}
  .choices button:active{background:var(--purple);color:#fff}
  .prompt{font-size:clamp(1.25rem,5vw,1.6rem);margin:8px 0}
  .math-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:start;overflow-wrap:anywhere}
  .lead{color:var(--muted);margin:4px 0 10px}
  .lead a{color:var(--purple);font-weight:700;text-decoration:none}
  .lead a:hover{text-decoration:underline}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .disclaimer{background:#fff7e0;border:1px solid #f0d58a;border-radius:12px;padding:10px 12px;margin:12px 0 0}
  .hidden{display:none}
  :focus-visible{outline:3px solid var(--purple);outline-offset:2px}
  footer{text-align:center;color:var(--muted);font-size:.9rem;padding:24px 0 16px;border-top:1px solid var(--line);margin-top:20px}
  footer a{color:var(--purple);text-decoration:none;font-weight:600;margin:0 6px}
  footer a:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
  .mm-skip{position:absolute;inset-inline-start:8px;top:8px;z-index:20;padding:8px 12px;background:#21183b;color:#fff;border-radius:8px;transform:translateY(-120%);font-weight:700}
  .mm-skip:focus{transform:none}
  #main:focus{outline:none}
</style>
<link rel="stylesheet" href="src/sefirot.css">
</head>
<body>
<a class="mm-skip" href="#main">דלגו לתוכן</a>
<main class="wrap" id="main" tabindex="-1">
  <h1>בדיקה לפני ואחרי יחידה</h1>
  <p class="lead"><a href="index.html">← חזרה לתרגול</a> · <a href="curriculum.html">כיסוי התוכנית</a></p>
  <p class="note">8 שאלות בלי מוזיקה. אותו סוג שאלה בשתי הבדיקות, עם מספרים אחרים. התוצאות נשמרות רק במכשיר הזה, בקוד הכיתה.</p>

  <section class="card" id="setup" aria-labelledby="setupTitle">
    <h2 id="setupTitle">מי נבדק/ת</h2>
    <label for="classCode">קוד כיתה</label>
    <input id="classCode" autocomplete="off">
    <label for="studentName">שם או קוד תלמיד/ה</label>
    <input id="studentName" autocomplete="off">
    <label for="unit">יחידה</label>
    <select id="unit"></select>
    <div class="row">
      <button type="button" id="startPre">בדיקה לפני היחידה</button>
      <button type="button" id="startPost" class="secondary">בדיקה אחרי היחידה</button>
    </div>
    <p class="note" id="setupStatus" role="status" aria-live="polite"></p>
  </section>

  <section class="card hidden" id="quiz" aria-labelledby="quizProgress">
    <h2 id="quizProgress" aria-live="polite"></h2>
    <p class="prompt" id="quizPrompt"></p>
    <div class="choices" id="quizChoices" role="group" aria-label="אפשרויות תשובה"></div>
    <div class="row" style="margin-top:16px">
      <button type="button" id="quizCancel" class="secondary" aria-label="ביטול הבדיקה וחזרה למסך הראשי">ביטול הבדיקה וחזרה</button>
    </div>
  </section>

  <section class="card" id="report" aria-labelledby="reportTitle">
    <h2 id="reportTitle">דוח למורה: לפני מול אחרי</h2>
    <button type="button" id="showReport" class="secondary">הצגת הדוח לקוד הכיתה</button>
    <div id="reportBody"></div>
    <p class="disclaimer" id="disclaimer"></p>
  </section>

  <footer>
    <div>MelodyMath · בדיקה לפני ואחרי יחידה · <a href="index.html">חזרה לתרגול</a> · <a href="curriculum.html">תוכנית לימודים</a> · <a href="landing.html">אודות</a></div>
  </footer>
</main>
<script src="src/lib/teacherStore.js"></script>
<script src="src/lib/mathBidi.js"></script>
<script src="src/lib/unitCheck.js"></script>
<script src="src/lib/access.js"></script>
<script src="src/lib/core.js"></script>
<script>
(function () {
  const $ = function (id) { return document.getElementById(id); };
  let run = null;

  $('unit').innerHTML = listUnits().map(function (u) {
    return '<option value="' + escapeHtml(u.id) + '">' + escapeHtml(u.he) + '</option>';
  }).join('');
  const who = loadWho();
  $('classCode').value = who.classCode;
  $('studentName').value = who.name;
  $('disclaimer').textContent = UNIT_CHECK_DISCLAIMER;

  function start(form) {
    const classCode = normalizeCode($('classCode').value);
    const name = studentLabel($('studentName').value);
    if (!name) {
      $('setupStatus').textContent = 'צריך שם או קוד תלמיד/ה.';
      $('studentName').focus();
      return;
    }
    const unitId = $('unit').value;
    const session = startSession(classCode, name, checkKind(unitId, form));
    if (!session) { $('setupStatus').textContent = 'לא הצלחנו לפתוח בדיקה במכשיר הזה.'; return; }
    saveWho({ classCode: classCode, name: name });
    run = { classCode: classCode, name: name, session: session, items: formItems(unitId, form), at: 0, correct: 0 };
    $('setupStatus').textContent = '';
    $('setup').classList.add('hidden');
    $('report').classList.add('hidden');
    $('quiz').classList.remove('hidden');
    showItem();
  }

  function showItem() {
    const item = run.items[run.at];
    $('quizProgress').textContent = 'שאלה ' + (run.at + 1) + ' מתוך ' + run.items.length;
    setMath($('quizPrompt'), item.prompt);
    $('quizChoices').innerHTML = shuffledChoices(item.choices).map(function (c, idx) {
      return '<button type="button" data-choice="' + escapeHtml(c) + '" aria-label="תשובה ' + (idx + 1) + ': ' + escapeHtml(c) + '"><bdi dir="ltr">' + escapeHtml(c) + '</bdi></button>';
    }).join('');
    $('quizChoices').querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { answer(b.dataset.choice); };
    });
    const firstChoice = $('quizChoices').querySelector('button');
    if (firstChoice) firstChoice.focus();
  }

  function answer(given) {
    const item = run.items[run.at];
    const ok = isCheckCorrect(item, given);
    if (ok) run.correct++;
    addItem(run.classCode, run.name, run.session.id, {
      skill: UNIT_CHECK_SKILL_HE[item.skill] || item.skill, prompt: item.prompt,
      answer: item.answer, given: given, correct: ok,
    });
    run.at++;
    if (run.at < run.items.length) { showItem(); return; }
    endSession(run.classCode, run.name, run.session.id);
    $('quiz').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('report').classList.remove('hidden');
    $('setupStatus').textContent = run.name + ' סיים/ה: ' + run.correct + ' מתוך ' + run.items.length + '. נשמר במכשיר הזה.';
    run = null;
    $('studentName').focus();
    renderReport();
  }

  function cancelQuiz() {
    if (!run) return;
    if (run.session) {
      endSession(run.classCode, run.name, run.session.id);
    }
    $('quiz').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('report').classList.remove('hidden');
    $('setupStatus').textContent = 'הבדיקה בוטלה.';
    run = null;
    $('studentName').focus();
  }

  function cell(check) {
    return check ? check.correct + '/' + check.total : '—';
  }

  function renderReport() {
    const classCode = normalizeCode($('classCode').value);
    const r = checkReport(loadRoster(classCode).students, $('unit').value);
    if (!r.rows.length) {
      $('reportBody').innerHTML = '<p class="note" id="reportEmpty">אין עדיין בדיקות בקוד הכיתה הזה במכשיר הזה.</p>';
      return;
    }
    const fmt = function (x) { return x == null ? '—' : (Math.round(x * 10) / 10) + '/' + r.total; };
    const rows = r.rows.map(function (row) {
      const change = row.change == null ? '—' : (row.change > 0 ? '+' : '') + row.change;
      return '<tr><th scope="row">' + escapeHtml(row.name) + '</th><td><bdi dir="ltr">' + cell(row.pre) + '</bdi></td><td><bdi dir="ltr">'
        + cell(row.post) + '</bdi></td><td><bdi dir="ltr">' + change + '</bdi></td></tr>';
    }).join('');
    $('reportBody').innerHTML = '<p>כיתה <b>' + escapeHtml(classCode || 'ברירת מחדל') + '</b> · n = ' + r.n
      + ' תלמידים עם שתי הבדיקות. ממוצע לפני <bdi dir="ltr">' + fmt(r.meanPre) + '</bdi>, ממוצע אחרי <bdi dir="ltr">'
      + fmt(r.meanPost) + '</bdi>.' + (r.preOnly ? ' ' + r.preOnly + ' עשו רק את הבדיקה שלפני.' : '')
      + (r.postOnly ? ' ' + r.postOnly + ' עשו רק את הבדיקה שאחרי.' : '') + '</p>'
      + '<table aria-describedby="reportTitle"><caption class="sr-only">דוח תוצאות בדיקה לפי תלמיד</caption><thead><tr><th scope="col">תלמיד/ה</th>'
      + '<th scope="col">לפני</th><th scope="col">אחרי</th><th scope="col">שינוי</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  $('startPre').onclick = function () { start('pre'); };
  $('startPost').onclick = function () { start('post'); };
  $('quizCancel').onclick = cancelQuiz;
  $('showReport').onclick = renderReport;
  // הדוח נבנה מקוד הכיתה ומהיחידה שבטופס, אז שינוי שלהם מרענן אותו מיד.
  $('unit').onchange = renderReport;
  $('classCode').onchange = renderReport;
  // Enter בשדות הטופס מפעיל את הכפתור הראשי, כמו בסרגל המורה ב-index.html.
  $('classCode').onkeydown = function (e) { if (e.key === 'Enter') start('pre'); };
  $('studentName').onkeydown = function (e) { if (e.key === 'Enter') start('pre'); };

  // דוח קיים לקוד הכיתה השמור מוצג מיד, בלי לחכות ללחיצה על "הצגת הדוח".
  renderReport();
})();
</script>
</body>
</html>
