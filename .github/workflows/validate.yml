name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: node --test

  syntax:
    name: browser bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the shared logic modules
        run: for f in src/lib/*.js; do node --check "$f"; done && echo "OK: all modules parse cleanly"
      - name: Syntax-check inline scripts in every page
        run: |
          node -e "
            const fs=require('fs');
            let total=0;
            for (const page of ['index.html','functions.html','807.html','landing.html']) {
              const html=fs.readFileSync(page,'utf8');
              const inline=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);
              inline.forEach(x=>new Function(x));
              total+=inline.length;
              console.log(page+': '+inline.length+' inline scripts OK');
            }
            if(!total) throw new Error('no inline scripts found at all');
          "
      - name: Every module the app loads must exist
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('index.html','utf8');
            const srcs=[...html.matchAll(/<script src=\"(src\/[^\"]+)\"/g)].map(m=>m[1]);
            if(!srcs.length) throw new Error('index.html no longer loads any src/ module');
            for(const s of srcs){ if(!fs.existsSync(s)) throw new Error('missing module: '+s); }
            console.log('OK: '+srcs.length+' modules referenced and present');
          "
      - name: The tested logic must not be inlined back into the page
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('index.html','utf8');
            for (const fn of ['function yToFreq','function nextLevel','function normalizeAnswer']) {
              if (html.includes(fn)) throw new Error(fn+' was inlined again — it belongs in src/lib');
            }
            console.log('OK: tested logic lives only in src/lib');
          "
