name: ניסוי כיתתי — פנייה או משוב
description: הודעה שנפתח ניסוי של 4 שבועות, שאלה, או תשובה על שאלת הסיום. חינם, בלי חשבונית ובלי טענת יעילות.
title: "ניסוי כיתתי: "
body:
  - type: markdown
    attributes:
      value: |
        **שימו לב: הפנייה הזו ציבורית.** כל אחד יכול לקרוא אותה.
        אל תכתבו שמות של ילדים, טלפון, מייל או כתובת, ואל תצרפו דוחות או צילומי מסך עם שמות.
        התשובה תגיע כאן, כתגובה. אם צריך ערוץ פרטי, נתאם אותו כאן.
        אין כאן מוצר בתשלום ואין הרשמה. פרטים: [דף ההצעה](https://swissystem7.github.io/MelodyMath/offer.html).
  - type: dropdown
    id: kind
    attributes:
      label: מה הפנייה?
      options:
        - מתחילה ניסוי של 4 שבועות (או שוקלת להתחיל)
        - סיימתי ניסוי ורוצה לענות על שאלת הסיום
        - שאלה או תקלה
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: תפקיד
      options:
        - מחנכת שילוב
        - רכזת חינוך מיוחד
        - מורה
        - מנהל/ת
        - הורה
        - אחר
    validations:
      required: true
  - type: dropdown
    id: grade
    attributes:
      label: שכבה
      options:
        - א׳
        - ב׳
        - ג׳
        - ד׳
        - כמה שכבות
        - לא רלוונטי
  - type: dropdown
    id: worksheet
    attributes:
      label: "שאלת הסיום: האם היה כאן משהו שדף עבודה לא נותן?"
      description: רק למי שסיימה ניסוי. «לא» היא תשובה טובה ושימושית — היא אומרת שהכלי נשאר דמו.
      options:
        - עוד לא סיימתי ניסוי
        - כן
        - לא
        - לא בטוחה
  - type: textarea
    id: what
    attributes:
      label: מה בדיוק? (רשות)
      description: למשל «ההקראה עזרה לילד שלא קורא עדיין», או «הטאבלט נמחק ואיבדנו את הרישום». בלי שמות של ילדים.
