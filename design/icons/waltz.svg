<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ואלס — Viennese Waltz 3/4 Time">
  <title>ואלס (Waltz)</title>
  <desc>ואלס וינאי במשקל 3/4: חזק-חלש-חלש, שלוש פעמות בתיבה המייצגות כפולות של 3</desc>
  <rect width="64" height="64" rx="14" fill="#312e81"/>
  <!-- Elegant triangular conductor flow (1-2-3 loop) -->
  <path d="M32 16 L48 44 L16 44 Z" fill="none" stroke="#ffd85d" stroke-width="2.5" stroke-linejoin="round" opacity="0.6"/>
  <!-- Beat 1: Heavy downbeat at apex (Accented 1) -->
  <circle cx="32" cy="16" r="6" fill="#ffd85d"/>
  <text x="32" y="19" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#312e81">1</text>
  <!-- Beat 2: Right corner (Lighter 2) -->
  <circle cx="48" cy="44" r="4.5" fill="#ffffff"/>
  <text x="48" y="46.5" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#312e81">2</text>
  <!-- Beat 3: Left corner (Lighter 3) -->
  <circle cx="16" cy="44" r="4.5" fill="#ffffff"/>
  <text x="16" y="46.5" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#312e81">3</text>
  <!-- Swirling dance flow curves -->
  <path d="M32 23 C40 26, 44 34, 46 40" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2 2"/>
  <path d="M44 46 C34 49, 26 49, 18 46" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2 2"/>
  <path d="M18 40 C20 34, 24 26, 32 23" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2 2"/>
</svg>
