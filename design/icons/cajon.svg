<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="קחון — Afro-Peruvian Cajón Box Drum">
  <title>קחון (Cajón)</title>
  <desc>תוף תיבה אפרו-פרואני: מכות פאה, מקצוע ופינה המייצגות שטח, נפח ויחידות תיבה</desc>
  <rect width="64" height="64" rx="14" fill="#78350f"/>
  <!-- 3D perspective Cajon Box -->
  <!-- Top side (perspective plane) -->
  <polygon points="18,22 36,12 50,16 32,26" fill="#b45309" stroke="#ffd85d" stroke-width="1.2"/>
  <!-- Right side -->
  <polygon points="32,26 50,16 50,44 32,54" fill="#592b08" stroke="#ffd85d" stroke-width="1.2"/>
  <!-- Front Tapa Plate (main playing face) -->
  <polygon points="18,22 32,26 32,54 18,50" fill="#d97706" stroke="#ffd85d" stroke-width="1.5"/>
  <!-- Tapa fastening screws along perimeter -->
  <circle cx="20" cy="24" r="0.8" fill="#ffffff"/>
  <circle cx="25" cy="25" r="0.8" fill="#ffffff"/>
  <circle cx="30" cy="27" r="0.8" fill="#ffffff"/>
  <circle cx="30" cy="35" r="0.8" fill="#ffffff"/>
  <circle cx="30" cy="45" r="0.8" fill="#ffffff"/>
  <circle cx="30" cy="52" r="0.8" fill="#ffffff"/>
  <circle cx="20" cy="48" r="0.8" fill="#ffffff"/>
  <circle cx="20" cy="36" r="0.8" fill="#ffffff"/>
  <!-- Soundhole on side (isometric ellipse) -->
  <ellipse cx="42" cy="34" rx="4.5" ry="7" fill="#1c1917" stroke="#b45309" stroke-width="1"/>
  <!-- Rhythm tap pulses indicating high slap / low bass -->
  <circle cx="24" cy="29" r="2.5" fill="#fef08a"/>
  <circle cx="24" cy="40" r="3.5" fill="#ffd85d"/>
</svg>
