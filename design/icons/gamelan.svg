<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="גמלאן — Gamelan Gong &amp; Kotekan">
  <title>גמלאן (Gamelan)</title>
  <desc>גונג ברונזה מאינדונזיה ונגינת קוטקאן משתלבת: מחזורים ארוכים, כפולות וחלק-ושלם</desc>
  <rect width="64" height="64" rx="14" fill="#831843"/>
  <!-- Ornate Stand Frame (placing arch) -->
  <path d="M12 54 L12 16 Q32 10 52 16 L52 54" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- Base feet -->
  <rect x="8" y="52" width="8" height="4" rx="1" fill="#b45309"/>
  <rect x="48" y="52" width="8" height="4" rx="1" fill="#b45309"/>
  <!-- Hanging cords -->
  <line x1="26" y1="14" x2="26" y2="23" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="38" y1="14" x2="38" y2="23" stroke="#fef08a" stroke-width="1.5"/>
  <!-- Large Bronze Gong Face -->
  <circle cx="32" cy="35" r="16" fill="#b45309" stroke="#ffd85d" stroke-width="2"/>
  <circle cx="32" cy="35" r="12" fill="#d97706"/>
  <!-- Raised Central Boss (knob/pencu) -->
  <circle cx="32" cy="35" r="4.5" fill="#fef08a" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="32" cy="35" r="2" fill="#ffd85d"/>
  <!-- Radiating vibration waves -->
  <path d="M14 26 C12 30, 12 40, 14 44" fill="none" stroke="#ffd85d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M50 26 C52 30, 52 40, 50 44" fill="none" stroke="#ffd85d" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
