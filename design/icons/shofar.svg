<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="קריאות שופר — Shofar Calls">
  <title>קריאות שופר (Shofar)</title>
  <desc>קרן איל וקריאות מסורתיות: תקיעה, שברים ותרועה המייצגות ספירה, שברים של זמן וחוק הפילוג</desc>
  <rect width="64" height="64" rx="14" fill="#78350f"/>
  <!-- Sound wave arcs emanating from wide horn opening -->
  <path d="M48 18 C53 23, 56 29, 56 36 C56 43, 53 49, 48 54" fill="none" stroke="#ffd85d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M43 23 C46 27, 48 31, 48 36 C48 41, 46 45, 43 49" fill="none" stroke="#ffd85d" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M38 28 C40 30, 41 33, 41 36 C41 39, 40 42, 38 44" fill="none" stroke="#ffd85d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Shofar Body: natural ram horn curve -->
  <!-- Narrow mouthpiece starting at left bottom (12, 44), curving up and opening wide at right (35, 20 to 38, 48) -->
  <path d="M10 42 C12 36, 17 32, 22 30 C27 28, 30 24, 34 18 C37 20, 39 30, 38 44 C34 47, 28 47, 23 44 C18 41, 14 43, 10 44 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <!-- Horn ridges and texture rings -->
  <path d="M15 39 C16 41, 16 43, 15 44" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <path d="M20 34 C21 37, 22 41, 20 43" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <path d="M25 30 C27 34, 27 39, 26 44" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <path d="M30 25 C32 30, 33 37, 32 45" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <!-- Dark hollow bell opening -->
  <ellipse cx="36" cy="31" rx="2.5" ry="11" fill="#451a03" transform="rotate(8 36 31)"/>
  <!-- Mouthpiece tip -->
  <rect x="8" y="42" width="4" height="3" rx="1" fill="#451a03"/>
</svg>
