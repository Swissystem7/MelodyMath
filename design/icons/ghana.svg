<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="משחקי כפיים מגאנה — Ghana Clapping Games">
  <title>משחקי כפיים (Ghana Clapping)</title>
  <desc>משחקי כפיים של ילדים בגאנה: מחיאות כף, טפיחות ונקישות אצבעות לדגמים מחזוריים וסדרות</desc>
  <rect width="64" height="64" rx="14" fill="#ca8a04"/>
  <!-- Left hand clapping in towards center -->
  <g transform="translate(4, 2)">
    <path d="M12 40 L16 32 C18 28, 20 22, 24 24 C27 25, 26 30, 26 34 L28 26 C29 23, 33 24, 33 28 L32 35 L34 30 C35 27, 39 28, 38 33 L36 41 C33 46, 26 48, 20 48 Z" fill="#ffffff" stroke="#78350f" stroke-width="1.2"/>
  </g>
  <!-- Right hand mirroring left hand -->
  <g transform="translate(60, 2) scale(-1, 1)">
    <path d="M12 40 L16 32 C18 28, 20 22, 24 24 C27 25, 26 30, 26 34 L28 26 C29 23, 33 24, 33 28 L32 35 L34 30 C35 27, 39 28, 38 33 L36 41 C33 46, 26 48, 20 48 Z" fill="#fef08a" stroke="#78350f" stroke-width="1.2"/>
  </g>
  <!-- Center rhythmic clap impact burst -->
  <circle cx="32" cy="32" r="3" fill="#b45309"/>
  <path d="M32 20 L32 25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M41 23 L37 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 32 L39 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M41 41 L37 37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M23 23 L27 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 32 L25 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M23 41 L27 37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
