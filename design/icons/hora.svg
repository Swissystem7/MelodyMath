<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="מעגל הורה — Hora Circle Dance">
  <title>מעגל הורה (Hora)</title>
  <desc>ריקוד עם ישראלי במעגל: צעדים שווים סביב מוקד מרכזי המייצגים חלוקה שווה והיקף</desc>
  <rect width="64" height="64" rx="14" fill="#6946e8"/>
  <!-- Central pivot -->
  <circle cx="32" cy="32" r="5" fill="#ffd85d"/>
  <!-- Orbit track -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Dancers in a circle (6 dancers at 60 degree intervals) -->
  <!-- Dancer 1: Top (32, 13) -->
  <circle cx="32" cy="13" r="3.2" fill="#ffffff"/>
  <path d="M30 17 L34 17 L35 24 L29 24 Z" fill="#ffffff"/>
  <!-- Dancer 2: Top Right (48.5, 22.5) -->
  <circle cx="48.5" cy="22.5" r="3.2" fill="#ffffff"/>
  <path d="M47 26 L50 24 L54 30 L50 32 Z" fill="#ffffff"/>
  <!-- Dancer 3: Bottom Right (48.5, 41.5) -->
  <circle cx="48.5" cy="41.5" r="3.2" fill="#ffffff"/>
  <path d="M50 40 L47 38 L50 48 L46 50 Z" fill="#ffffff"/>
  <!-- Dancer 4: Bottom (32, 51) -->
  <circle cx="32" cy="51" r="3.2" fill="#ffffff"/>
  <path d="M30 47 L34 47 L35 40 L29 40 Z" fill="#ffffff"/>
  <!-- Dancer 5: Bottom Left (15.5, 41.5) -->
  <circle cx="15.5" cy="41.5" r="3.2" fill="#ffffff"/>
  <path d="M14 40 L17 38 L14 48 L18 50 Z" fill="#ffffff"/>
  <!-- Dancer 6: Top Left (15.5, 22.5) -->
  <circle cx="15.5" cy="22.5" r="3.2" fill="#ffffff"/>
  <path d="M17 26 L14 24 L10 30 L14 32 Z" fill="#ffffff"/>
  <!-- Linked hands ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffd85d" stroke-width="1.5" opacity="0.85"/>
</svg>
