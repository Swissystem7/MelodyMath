<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="גנאווה — Moroccan Gnawa Guembri &amp; Qraqeb">
  <title>גנאווה (Gnawa)</title>
  <desc>מסורת הגנאווה המרוקאית: גימברי בעל מיתרים נמוכים וקרקבים מברזל להשוואת מהירויות ופי כמה</desc>
  <rect width="64" height="64" rx="14" fill="#c2410c"/>
  <!-- Guembri wooden body with camel-skin head -->
  <rect x="18" y="28" width="16" height="26" rx="8" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <!-- Wooden bridge on skin -->
  <rect x="23" y="44" width="6" height="2" fill="#78350f"/>
  <!-- Long round neck pole passing through body -->
  <rect x="24.5" y="6" width="3" height="52" rx="1.5" fill="#78350f"/>
  <!-- Three strings -->
  <line x1="25" y1="12" x2="25" y2="44" stroke="#ffffff" stroke-width="0.75"/>
  <line x1="26" y1="12" x2="26" y2="44" stroke="#ffffff" stroke-width="0.75"/>
  <line x1="27" y1="12" x2="27" y2="44" stroke="#ffffff" stroke-width="0.75"/>
  <!-- Tuning leather tassels (bretelles) -->
  <circle cx="26" cy="14" r="2" fill="#ffd85d"/>

  <!-- Qraqeb (pair of iron castanets) on the right -->
  <!-- Top disc pair -->
  <ellipse cx="44" cy="22" rx="6" ry="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1.2"/>
  <ellipse cx="50" cy="22" rx="6" ry="4" fill="#64748b" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="44" y="21" width="6" height="2" fill="#cbd5e1"/>
  <!-- Connecting bridge bar -->
  <rect x="46" y="24" width="3" height="14" fill="#475569"/>
  <!-- Bottom disc pair -->
  <ellipse cx="44" cy="40" rx="6" ry="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1.2"/>
  <ellipse cx="50" cy="40" rx="6" ry="4" fill="#64748b" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="44" y="39" width="6" height="2" fill="#cbd5e1"/>
</svg>
