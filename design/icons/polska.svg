<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="פולסקה שוודית — Swedish Polska &amp; Nyckelharpa">
  <title>פולסקה (Polska)</title>
  <desc>פולסקה סקנדינבית וניקלהרפה: ימים, חודשים ועונות שלמות כצלילים ארוכים ומרווחים</desc>
  <rect width="64" height="64" rx="14" fill="#0284c7"/>
  <!-- Keyed fiddle (Nyckelharpa) body -->
  <path d="M22 52 C16 48, 16 38, 22 34 C20 30, 20 26, 23 24 L41 24 C44 26, 44 30, 42 34 C48 38, 48 48, 42 52 Z" fill="#fef3c7" stroke="#0369a1" stroke-width="1.5"/>
  <!-- Soundholes (f-holes) -->
  <path d="M24 38 C23 42, 25 46, 26 48" stroke="#0369a1" stroke-width="1.5" fill="none"/>
  <path d="M40 38 C41 42, 39 46, 38 48" stroke="#0369a1" stroke-width="1.5" fill="none"/>
  <!-- Long neck with keys (tangents) sticking out -->
  <rect x="29" y="8" width="6" height="18" fill="#78350f"/>
  <!-- Tangent keys protruding horizontally on left & right -->
  <line x1="24" y1="12" x2="29" y2="12" stroke="#ffd85d" stroke-width="2"/>
  <line x1="35" y1="14" x2="40" y2="14" stroke="#ffd85d" stroke-width="2"/>
  <line x1="24" y1="17" x2="29" y2="17" stroke="#ffd85d" stroke-width="2"/>
  <line x1="35" y1="19" x2="40" y2="19" stroke="#ffd85d" stroke-width="2"/>
  <line x1="24" y1="22" x2="29" y2="22" stroke="#ffd85d" stroke-width="2"/>
  <!-- Strings running down length -->
  <line x1="30.5" y1="9" x2="30.5" y2="48" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="32" y1="9" x2="32" y2="48" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="33.5" y1="9" x2="33.5" y2="48" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Tailpiece & Bridge -->
  <rect x="29" y="47" width="6" height="2" fill="#78350f"/>
  <polygon points="30,50 34,50 33,54 31,54" fill="#0369a1"/>
</svg>
