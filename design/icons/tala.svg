<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="טאבלה — North Indian Tala &amp; Tabla">
  <title>טאבלה (Tabla)</title>
  <desc>צמד תופי טאבלה (דאיאן ובאיאן): מחזורי טינטאל וג'אפטאל המייצגים כפל, שברים עשרוניים ושארית</desc>
  <rect width="64" height="64" rx="14" fill="#4338ca"/>
  <!-- Left Drum: Bayan (larger, rounded bass kettle) -->
  <path d="M10 32 C10 46, 17 54, 25 54 C33 54, 38 46, 37 32 Z" fill="#94a3b8" stroke="#312e81" stroke-width="1.2"/>
  <ellipse cx="23.5" cy="30" rx="13.5" ry="5.5" fill="#fef3c7" stroke="#312e81" stroke-width="1.2"/>
  <!-- Bayan Syahi (off-center black tuning paste spot) -->
  <ellipse cx="25" cy="29" rx="5.5" ry="2.5" fill="#1e1b4b"/>
  <!-- Lacing straps on Bayan -->
  <line x1="12" y1="33" x2="16" y2="51" stroke="#475569" stroke-width="0.8"/>
  <line x1="22" y1="35" x2="24" y2="54" stroke="#475569" stroke-width="0.8"/>
  <line x1="33" y1="34" x2="31" y2="51" stroke="#475569" stroke-width="0.8"/>

  <!-- Right Drum: Dayan (cylindrical tuned treble drum) -->
  <path d="M37 25 L39 52 L53 52 L53 25 Z" fill="#b45309" stroke="#312e81" stroke-width="1.2"/>
  <ellipse cx="45" cy="24" rx="9" ry="3.8" fill="#fef3c7" stroke="#312e81" stroke-width="1.2"/>
  <!-- Dayan Syahi (centered black spot) -->
  <ellipse cx="45" cy="24" rx="4" ry="1.8" fill="#1e1b4b"/>
  <!-- Tuning wooden pegs (Gatta) -->
  <rect x="36" y="34" width="3.5" height="5" rx="1" fill="#ffd85d"/>
  <rect x="52" y="34" width="3.5" height="5" rx="1" fill="#ffd85d"/>
  <!-- Dayan vertical lacing straps -->
  <line x1="41" y1="27" x2="42" y2="52" stroke="#fde68a" stroke-width="0.8"/>
  <line x1="46" y1="27" x2="46" y2="52" stroke="#fde68a" stroke-width="0.8"/>
  <line x1="50" y1="27" x2="49" y2="52" stroke="#fde68a" stroke-width="0.8"/>

  <!-- Ring cushions at base (Bira) -->
  <ellipse cx="24" cy="54" rx="11" ry="3" fill="#ffd85d" opacity="0.9"/>
  <ellipse cx="46" cy="53" rx="8" ry="2.5" fill="#ffd85d" opacity="0.9"/>
</svg>
