<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="גיג אירי — Irish Jig 6/8 Time">
  <title>גיג (Jig)</title>
  <desc>גיג אירי מסורתי במשקל 6/8: שתי קבוצות של שלוש (3+3) המייצגות כפולות של 6 ומשקל מורכב</desc>
  <rect width="64" height="64" rx="14" fill="#065f46"/>
  <!-- Bodhrán Drum frame -->
  <circle cx="32" cy="32" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <!-- Inner crossbar inside bodhran -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="32" y1="16" x2="32" y2="48" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <!-- Six rhythmic beat indicators arranged in 2 groups of 3 (3 on top, 3 on bottom) -->
  <!-- Group A (1, 2, 3) -->
  <circle cx="24" cy="22" r="3.2" fill="#047857"/>
  <circle cx="32" cy="18" r="2.2" fill="#047857"/>
  <circle cx="40" cy="22" r="2.2" fill="#047857"/>
  <!-- Group B (4, 5, 6) -->
  <circle cx="40" cy="42" r="3.2" fill="#047857"/>
  <circle cx="32" cy="46" r="2.2" fill="#047857"/>
  <circle cx="24" cy="42" r="2.2" fill="#047857"/>
  <!-- Irish Tipper (beater) across the drum -->
  <path d="M18 46 L46 18" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="18" cy="46" r="3.5" fill="#ffd85d"/>
  <circle cx="46" cy="18" r="3.5" fill="#ffd85d"/>
</svg>
